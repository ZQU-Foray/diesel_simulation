# Copyright 2026 ZQU-Foray
#
# Nav2 在 rmul_2027 场地仿真里的参数（A3 用）。
#
# 与原版 pb2025_nav_bringup 的仿真参数**不完全一致**，差异都有实测理由，别照抄回去：
#
# 1) 地图口径不同：这里配的是 `map/nav2/rmul_2027_nav.pgm`（本仓由官方图派生的
#    「底盘可通行」栅格，只打开了隧道开放段），不是定位侧的官方图。理由见 decision.md D16。
# 2) inflation_radius 必须 ≤ 0.20：隧道净宽 0.8 m（parameters.json 的 tunnel_clear_span），
#    上游 0.7 m 的膨胀要 1.4 m 空间，规划器会判定整条隧道不可通行。0.20 + 底盘半宽 0.12
#    后中心仍留约 0.28 m 可走带（实测各列自由带 0.775–0.825 m）。
# 3) 不启用地形/体素/障碍层：本关 A3 只验「静态几何可达」，场地固定、无动态障碍；点云层
#    反而会把隧道顶（z 0.25–0.27，车顶之上）当成障碍封路。要验动态避障得另立任务。
# 4) 用 footprint 四点而不是 robot_radius：底盘 0.30×0.24 是长方形，0.8 m 通道里用外接圆
#    会白丢 3 cm 余量（外接圆半径 0.192 m > 半宽 0.12 m）。
# 5) 控制器用 pb 的 omni PID 纯追踪（`pb_omni_pid_pursuit_controller`）：车体是 Ignition
#    VelocityControl 全向控制（可侧移），DWB 默认的差速模型用不上侧移，窄通道里更容易卡。
#    该插件输出 linear.x/linear.y/angular.z，正好对接 /cmd_vel 桥。
# 6) tf 容差整体放大到 0.5 s：仿真里 point_lio 里程计约 7 Hz 且时间戳取 lidar_beg_time，
#    比 /clock 落后 0.2–0.3 s（见 localization_sim.launch.py 的时限注释），默认 0.1 s 会
#    让 costmap 频繁报 "Timed out waiting for transform"。

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    # sensor_scan_generation 补出的 odom→base_footprint 里程计话题
    # 绝对名：里程计由 sensor_scan_generation 发在全局 /odometry，
    # 而 Nav2 整栈在 /diesel/<robot> 下，相对名会解析成
    # /diesel/sentry/odometry 收不到。
    odom_topic: /odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # 绝对名：里程计由 sensor_scan_generation 发在全局 /odometry，
    # 而 Nav2 整栈在 /diesel/<robot> 下，相对名会解析成
    # /diesel/sentry/odometry 收不到。
    odom_topic: /odometry
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 隧道里 0.25 m 的位移阈值约等于 0.3 s 正常行驶量；15 s 允许时间给窄道减速留余量
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    # 终点判定：位置 0.10 m（定位实测 max_xy_err 0.086 m，再收紧会假失败）、朝向 0.30 rad
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.30

    FollowPath:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      transform_tolerance: 0.5
      min_max_sum_error: 1.0
      translation_kp: 3.0
      translation_ki: 0.1
      translation_kd: 0.3
      # 全向底盘：朝向由路径切线自己收敛，不做原地转体（转体在 0.8 m 通道里会蹭墙）
      enable_rotation: false
      rotation_kp: 3.0
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.8
      lookahead_time: 1.0
      use_interpolation: true
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.6
      # 允许少量倒车修正，但不许高速倒退
      v_linear_min: -0.5
      v_linear_max: 1.0
      v_angular_min: -1.5
      v_angular_max: 1.5
      # 曲率缩放：进入弯道前降速，直道上跑满
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[-0.15, -0.12], [0.15, -0.12], [0.15, 0.12], [-0.15, 0.12]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.20
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      resolution: 0.025
      # 派生图只有 0 / 254 两值，没有 unknown，跟踪未知反而会让规划器绕开边界带
      track_unknown_space: false
      transform_tolerance: 0.5
      footprint: "[[-0.15, -0.12], [0.15, -0.12], [0.15, 0.12], [-0.15, 0.12]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.20
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # yaml_filename 由 navigation_sim.launch.py 用 share 绝对路径覆盖（写死路径会在
    # install/ 与 build/ 之间漂移）
    topic_name: map
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      # 派生图没有 unknown，也不许规划器把地图外的未知区当可走
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 1.5]
    min_velocity: [-0.5, -1.0, -1.5]
    max_accel: [1.0, 1.0, 2.0]
    max_decel: [-1.0, -1.0, -2.0]
    # 绝对名：里程计由 sensor_scan_generation 发在全局 /odometry，
    # 而 Nav2 整栈在 /diesel/<robot> 下，相对名会解析成
    # /diesel/sentry/odometry 收不到。
    odom_topic: /odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
