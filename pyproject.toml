# 工具配置。目标 Python 版本与 CI / ROS 2 humble 保持一致（3.10），
# 避免 ruff 的自动修复引入 3.11+ 才有的写法（例如把 datetime.timezone.utc
# 改成 datetime.UTC，运行时在 3.10 上会 AttributeError）。
#
# 本仓 Python 只有 bringup 的 launch / scripts 与 field 的 tools / test，
# 没有需要打包的 Python 分发包，故只配置检查器，不配置 build-system。
[tool.ruff]
target-version = "py310"

# black 的默认 line-length 是 88，与 ruff 默认一致；这里显式写出来是为了让
# 「为什么 88」在仓内可查：本仓最长的一行是 launch 里的参数表，88 列下可读性仍好，
# 再放宽会与上游 ROS 2 包的排版习惯脱节。
[tool.black]
line-length = 88
target-version = ["py310"]
